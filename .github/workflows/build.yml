name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: runner.os == 'Linux'
        run: pip install python-docx && npm test
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/appimage/*
