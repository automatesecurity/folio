[package]
name = "folio"
version = "0.3.0"
description = "A lightweight word processor for Word documents"
authors = ["Daniel Wood"]
edition = "2021"

[lib]
name = "folio_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
tempfile = "3"
which = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
